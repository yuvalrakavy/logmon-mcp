[package]
name = "logmon-broker-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = ["dep:tempfile"]

[dependencies]
logmon-broker-protocol = { path = "../protocol" }
tokio.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
fs2.workspace = true
async-trait.workspace = true
socket2.workspace = true
tonic.workspace = true
prost.workspace = true
opentelemetry-proto.workspace = true
axum.workspace = true
tempfile = { workspace = true, optional = true }
sketches-ddsketch = "0.4.0"
# Column alignment in rendered tables. Already in the lock file, and the
# alternative — `chars().count()` — misaligns every row beneath a CJK value.
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { workspace = true }

[dev-dependencies]
tokio-test.workspace = true
tempfile.workspace = true
tracing-test = "0.2"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "span_ingest"
harness = false
