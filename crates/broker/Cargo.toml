[package]
name = "logmon-broker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "logmon-broker"
path = "src/main.rs"

[dependencies]
logmon-broker-protocol = { path = "../protocol" }
logmon-broker-core = { path = "../core" }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
dirs.workspace = true

[dev-dependencies]
# The kill -9 harness: spawns the real binary (CARGO_BIN_EXE_logmon-broker),
# SIGKILLs it, and talks to both incarnations through the SDK over a
# LOGMON_CONFIG_DIR-redirected socket.
logmon-broker-sdk = { path = "../sdk" }
tempfile = { workspace = true }
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { workspace = true }
