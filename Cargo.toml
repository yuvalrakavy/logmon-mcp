[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/core",
    "crates/broker",
    "crates/sdk",
    "crates/mcp",
    "crates/xtask",
]
default-members = ["crates/broker", "crates/mcp"]

[workspace.package]
version = "0.10.0"
edition = "2021"
authors = ["yuval@villarakavy.com"]
license = "MIT"
repository = "https://github.com/yuval/logmon-mcp"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
async-trait = "0.1"
socket2 = "0.5"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
opentelemetry-proto = { version = "0.31", features = ["gen-tonic", "logs", "trace"] }
axum = "0.8"
rmcp = { version = "1.2", features = ["server", "macros", "transport-io"] }
tokio-stream = "0.1"
tokio-test = "0.4"
tempfile = "3"
sd-notify = "0.4"
which = "6"
dirs = "5"
libc = "0.2"
rand = "0.8"
# Case bundles. Default features off: the archive needs DEFLATE and nothing
# else, and every extra codec is surface on the one artifact that travels
# between machines. This sits AROUND the format contract rather than on it — an
# abandoned crate still leaves every case readable by every unzip in existence,
# which is why it is defensible where a YAML parser was not.
zip = { version = "2", default-features = false, features = ["deflate"] }
